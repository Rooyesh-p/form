<!DOCTYPE html>
<html lang="fa">
<head>
  <meta charset="UTF-8" />
  <title>سپاس از شما</title>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" href="logo.png" />
  <style>
    body {
      direction: rtl;
      font-family: 'Vazirmatn', 'BNazanin', sans-serif;
      margin: 0;
      padding: 0;
      background: linear-gradient(135deg, #f1fdf5, #d9f2e7);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      animation: fadeIn 1.5s ease-in-out;
    }

    .message {
     <img src="logo.png" alt="لوگوی رویش" style="width: 90px; border-radius: 50%; margin-bottom: 20px;" />
      background: white;
      padding: 50px 60px;
      border-radius: 20px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.12);
      border: 2px dashed var(--green-main);
      text-align: center;
      max-width: 600px;
    }

    .message h1 {
      font-size: 28px;
      color: var(--green-main);
      margin-bottom: 16px;
      font-weight: 800;
    }

    .message p {
      font-size: 19px;
      color: #444;
      line-height: 1.8;
    }

.emoji {
  font-size: 36px;
  font-family: 'BNazanin', cursive;
  font-style: italic;
  color: #2e7d32;
  margin-top: 30px;
  animation: fadeIn 2s ease-in-out 1.5s forwards;
  opacity: 0;
}


    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <div class="message">
    <h1>ممنون از پاسخگوییتون 🙏</h1>
    <p>پادکست شخصی‌سازی‌شده شما در نسخه بتا<br>تا ۲۴ ساعت آینده براتون ایمیل میشه.</p>
    <div class="emoji">🌿 مانا باشید</div>
  </div>
</body>
</html>
